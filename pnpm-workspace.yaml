packages:
  - packages/*

catalogMode: prefer

allowBuilds:
  esbuild: true
  vue-demi: true

catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@commitlint/types': ^21.2.3
  '@faker-js/faker': ^10.6.0
  '@iconify-json/mdi': ^1.2.3
  '@iconify-json/vscode-icons': ^1.2.97
  '@type-challenges/utils': ^0.1.1
  '@types/markdown-it-footnote': ^3.0.4
  '@vitest/coverage-v8': 5.1.0
  '@vueuse/core': ^15.0.0
  consola: ^3.4.2
  markdown-it-footnote: ^4.0.0
  markdown-it-mathjax3: ^5.2.0
  markdown-it-task-lists: ^2.1.1
  medium-zoom: ^1.1.2
  mermaid: ^12.3.0
  rimraf: ^6.1.4
  rollup-plugin-visualizer: ^7.1.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  unocss: ^66.12.0
  unplugin-auto-import: ^21.1.0
  unplugin-vue-components: ^32.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitepress: 1.6.4
  vitepress-plugin-mermaid: ^2.0.17
  vitest: 5.1.0
  vue: ^3.5.45

minimumReleaseAgeExclude:
  - '@babel/parser@7.29.14'
  - '@testing-library/user-event@14.6.10'
  - '@babel/helper-string-parser@7.29.14'
  - '@babel/types@7.29.14'

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
